[general]
name = "flashrt-qkv-cache-rope"
license = "Apache-2.0"
version = 1
backends = ["cuda", "rocm"]

[general.cuda]
minver = "12.8"

[general.hub]
repo-id = "flashrt/flashrt-qkv-cache-rope"

[torch]
include = ["csrc"]
src = [
  "torch-ext/torch_binding.cpp",
  "torch-ext/torch_binding.h",
]

[kernel.flashrt_qkv_cache_rope]
backend = "cuda"
depends = ["torch"]
include = ["csrc"]
cuda-minver = "12.8"
cuda-flags = [
  "-DFLASHRT_HAVE_COSMOS3_EDGE=1",
  "-U__CUDA_NO_BFLOAT16_CONVERSIONS__",
]
src = [
  "csrc/qkv_cache_rope.cu",
  "csrc/qkv_cache_rope.cuh",
  "csrc/cosmos_edge/cosmos3_edge_misc.cu",
  "csrc/cosmos_edge/cosmos3_edge_misc.cuh",
  "csrc/cosmos_edge/common.cuh",
]

[kernel.flashrt_qkv_cache_rope_rocm]
backend = "rocm"
depends = ["torch"]
include = ["csrc"]
rocm-archs = [
  "gfx950",
]
src = [
  "csrc/rocm/qkv_cache_rope_rocm.hip",
  "csrc/rocm/qkv_cache_rope_rocm.h",
]
